name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[numpy,dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: python -m pytest -q
      - name: Smoke-run the CLI
        run: |
          threadwise workloads
          threadwise bench io-latency -n 8 -w 2 -r 1 --warmup 0
          threadwise bench examples/parse_invoices.py -n 4 -w 2 -r 1 --warmup 0 --json > /tmp/bench.json
          python -c "import json;d=json.load(open('/tmp/bench.json'));assert d['verdict']['results_identical']"
          threadwise sweep io-latency --sizes 1,2,4 -n 16 -r 1 --warmup 0 --json > /tmp/sweep.json
          python -c "import json;d=json.load(open('/tmp/sweep.json'));assert d['sweep']['fit'] is not None"
          threadwise bench --html /tmp/report.html -n 8 -w 2 -r 1 --warmup 0
          test -s /tmp/report.html
